megafauna:
  - id: glassback-mammoths
    name: Glassback Mammoths
    section: "1A"
    region: High Escarpment Continent
    status:
      - candidate_canon_seed
    ecological_role:
      - herbivore
      - grazer
      - herd_megafauna
    habitat:
      dry: high-elevation crystal desert
      wet: snowfield / ice-locked highland
    morphology:
      scale: massive
      body_plan: low-slung
      surface_features:
        - shaggy coat
        - translucent mineral plates along spine and shoulders
        - tusks / plated head
      visual_anchor: "Massive shaggy low-slung herd animals with translucent mineral armor along the back and shoulders."
    diet:
      - crystal lichens
      - wind-buried scrub
      - salt-mineral outcrops
      - snowline growth
    dry_season_behavior:
      - move in slow herds across crystal desert heights
      - block highland convoy roads
      - shatter fragile crystal crust with herd weight
      - follow warm engine exhaust or salt spills
      - mistake fuel depots and coolant stations for mineral lick sites
    wet_season_strategy:
      - grow dense insulating underfur
      - migrate to wind-scoured ridgelines
      - break ice crust for lichen access
      - enter semi-torpor during long whiteouts
      - shelter calves in leeward crystal hollows
    map_hazard:
      - seasonal herd corridors can close roads
      - migration bands can force Prime Ops reroutes
    cultural_associations:
      Meridian_crews: stubborn road hazards
      Bought_Nation_route_families: snowfield weather prophecy
      World_Works: large ungulate obstruction events
    visual_tags:
      - shaggy
      - translucent_plates
      - herd
      - tusked
      - snowfield
      - crystal_desert

